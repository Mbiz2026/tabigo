<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12706B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タビゴ">
<title>タビゴ | 旅英語トレーニング</title>
<style>
:root{
  --bg:#F2F5F4; --card:#FFFFFF; --ink:#20302D; --sub:#5F6E6A; --line:#DBE3E1;
  --accent:#12706B; --accent-ink:#FFFFFF; --hl:#E7F0EF;
  --ok:#3E8E5A; --ok-bg:#E9F3EC; --warn:#C05B2E; --warn-bg:#F8ECE5;
  --gold:#B8860B; --gold-bg:#F7F0DC;
  --shadow:0 1px 3px rgba(32,48,45,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121B19; --card:#1B2624; --ink:#E5ECEA; --sub:#98A7A3; --line:#2D3B38;
    --accent:#4FB3AA; --accent-ink:#0D1716; --hl:#22312E;
    --ok:#6FBF8B; --ok-bg:#1E2F26; --warn:#E08A5F; --warn-bg:#33261E;
    --gold:#D9B44A; --gold-bg:#2E2A1B;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --bg:#F2F5F4; --card:#FFFFFF; --ink:#20302D; --sub:#5F6E6A; --line:#DBE3E1;
  --accent:#12706B; --accent-ink:#FFFFFF; --hl:#E7F0EF;
  --ok:#3E8E5A; --ok-bg:#E9F3EC; --warn:#C05B2E; --warn-bg:#F8ECE5;
  --gold:#B8860B; --gold-bg:#F7F0DC;
  --shadow:0 1px 3px rgba(32,48,45,.08);
}
:root[data-theme="dark"]{
  --bg:#121B19; --card:#1B2624; --ink:#E5ECEA; --sub:#98A7A3; --line:#2D3B38;
  --accent:#4FB3AA; --accent-ink:#0D1716; --hl:#22312E;
  --ok:#6FBF8B; --ok-bg:#1E2F26; --warn:#E08A5F; --warn-bg:#33261E;
  --gold:#D9B44A; --gold-bg:#2E2A1B;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
#wrap{max-width:640px;margin:0 auto;padding:16px 16px 64px}
header.appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:var(--accent)}
.brand small{color:var(--sub);font-weight:600;margin-left:8px;letter-spacing:.06em}
.sessmeta{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
h1{font-size:1.3rem;line-height:1.4;margin:0 0 8px;text-wrap:balance}
h2{font-size:1.02rem;margin:0 0 8px}
p{margin:0 0 12px}
.sub{color:var(--sub);font-size:.88rem}
.eyebrow{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.12em;color:var(--accent);background:var(--hl);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.why{font-size:.78rem;color:var(--sub);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;display:inline-block;margin-bottom:8px}
.prompt-en{font-size:1.4rem;font-weight:700;margin:6px 0 4px;font-family:Georgia,"Times New Roman",serif}
.prompt-ja{font-size:1.25rem;font-weight:700;margin:6px 0 4px;line-height:1.55}
button{
  font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;width:100%;
  transition:border-color .12s, background .12s;
}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{background:var(--hl)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;text-align:center}
.btn-ghost{background:transparent;text-align:center;color:var(--sub)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row button{flex:1;text-align:center}
.choice.correct{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--warn);background:var(--warn-bg)}
.timer{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--sub);margin-top:4px}
.model-answer{background:var(--hl);border-radius:10px;padding:12px 14px;margin-top:12px}
.model-answer .en{font-size:1.12rem;font-weight:700;font-family:Georgia,serif}
.model-answer .alt{font-size:.85rem;color:var(--sub);margin-top:2px}
.play-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:14px}
.play-btn.small{padding:8px 12px;font-size:.9rem}
.menu-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.menu-grid button{text-align:center;padding:16px 8px}
.menu-grid .m-min{font-size:1.5rem;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.menu-grid .m-desc{font-size:.72rem;color:var(--sub);display:block;line-height:1.4;margin-top:2px}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mode-grid button{text-align:center;padding:10px 4px;font-size:.88rem;font-weight:700}
.mode-grid .m-desc{display:block;font-size:.62rem;color:var(--sub);font-weight:600;margin-top:2px}
.mode-grid button.sel{border-color:var(--accent);background:var(--hl);color:var(--accent)}
.drive-main{width:100%;min-height:38vh;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:18px}
.statrow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding:7px 0;gap:12px}
.statrow:last-child{border-bottom:none}
.statrow .k{font-size:.88rem}
.statrow .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.big-metric{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.big-metric .num{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.big-metric .unit{color:var(--sub);font-weight:700}
.delta{font-size:.85rem;font-weight:700}
.delta.down{color:var(--ok)}
.delta.up{color:var(--warn)}
svg.graph{width:100%;height:150px;display:block}
.mapline{display:flex;align-items:center;overflow-x:auto;padding:6px 2px;gap:0}
.mstop{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;min-width:56px}
.mdot{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.mstop.done .mdot{background:var(--accent);border-color:var(--accent)}
.mstop.now .mdot{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--hl)}
.mlabel{font-size:.66rem;color:var(--sub);white-space:nowrap}
.mstop.now .mlabel{color:var(--accent);font-weight:700}
.mline{flex:0 0 22px;height:2px;background:var(--line);position:relative;top:-9px}
.mline.done{background:var(--accent)}
.tagchip{display:inline-block;background:var(--hl);color:var(--accent);border-radius:999px;font-size:.76rem;font-weight:700;padding:2px 10px;margin:2px 4px 2px 0}
.reward{border:1.5px solid var(--gold);background:var(--gold-bg)}
.reward .eyebrow{color:var(--gold);background:transparent;border:1px solid var(--gold)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.92rem}
.feedback.good{background:var(--ok-bg);color:var(--ok);font-weight:700}
.feedback.bad{background:var(--warn-bg)}
.chunk-ex{margin-top:8px;font-size:.92rem;color:var(--sub)}
.chunk-ex .en{font-family:Georgia,serif;font-weight:600;color:var(--ink)}
.shadow-line{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:10px 0}
.shadow-line:last-child{border-bottom:none}
.shadow-line .t{flex:1}
.shadow-line .en{font-family:Georgia,serif;font-weight:700}
.shadow-line .ja{font-size:.8rem;color:var(--sub)}
.shadow-line button{width:auto;flex:0 0 auto}
.story-text{font-family:Georgia,serif;font-size:1.05rem;line-height:1.9;margin:10px 0}
.progressbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.homefoot{display:flex;gap:14px;justify-content:center;margin-top:6px}
.homefoot button{width:auto;border:none;background:none;color:var(--sub);font-size:.8rem;padding:4px 8px;text-decoration:underline;cursor:pointer}
input[type=text]{
  font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);font-size:1rem;
}
input[type=text]:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
@media (prefers-reduced-motion: no-preference){
  .card{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

</div>

/* =====================================================
   状態管理

const KEY = "tabigo-train-v1";
const TARGET_SEC = 3.0;

function defaults(){
  return {
    profile:{anchor:null, start:todayStr(), listenRate:DIAG.listenStart, listenIdx:0, shadowIdx:0, onboarded:false},
    srs:{},            // id -> {ivl,due,ease,reps,lap,hist:[{d,sec,r}],stage} stage: chunkは0=認識,1=想起
    log:[],            // {d, n, medSec, min}
    owned:[],          // 獲得したご褒美id
    totalReviews:0,
  };
}
function normalize(d){
  const base = defaults();
  if(!d || typeof d !== "object" || !d.profile) return base;
  d.profile = Object.assign(base.profile, d.profile);
  d.srs = d.srs || {}; d.log = d.log || []; d.owned = d.owned || [];
  d.totalReviews = d.totalReviews || 0;
  return d;
}
/* 保存は二重化: localStorage(高速)+ IndexedDB(復旧用)。表示環境によって
   片方が消えることがあるため。両方消えたときはバックアップコードで復元する */
function save(){
  const json = JSON.stringify(D);
  try{ localStorage.setItem(KEY, json); }catch(e){}
  idbPut(json);
}
function load(){ try{ const r = localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

const IDB_NAME = "tabigo", IDB_STORE = "kv";
function idbOpen(cb){
  try{
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} };
    r.onsuccess = ()=>cb(r.result);
    r.onerror = ()=>cb(null);
  }catch(e){ cb(null); }
}
function idbPut(json){
  idbOpen(db=>{ if(!db) return; try{ db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(json, KEY); }catch(e){} });
}
function idbGet(){
  return new Promise(res=>{
    idbOpen(db=>{
      if(!db) return res(null);
      try{
        const g = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(KEY);
        g.onsuccess = ()=>res(g.result||null);
        g.onerror = ()=>res(null);
      }catch(e){ res(null); }
    });
  });
}
function idbClear(){
  idbOpen(db=>{ if(!db) return; try{ db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete(KEY); }catch(e){} });
}

/* バックアップコード: 全学習データを1つの文字列に(貼り付けで完全復元) */
function exportCode(){ return "TABIGO1." + btoa(unescape(encodeURIComponent(JSON.stringify(D)))); }
function importCode(str){
  try{
    const s = String(str).trim();
    if(!s.startsWith("TABIGO1.")) return false;
    const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(8)))));
    if(!d || !d.profile) return false;
    D = normalize(d); save(); return true;
  }catch(e){ return false; }
}
function copyText(text, btn){
  const done = ()=>{ if(btn) btn.textContent = "コピーしました ✓"; };
  const fallback = ()=>{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}

let D = normalize(load());

function todayStr(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }
function currentWeek(){ return Math.min(12, Math.floor(daysBetween(D.profile.start, todayStr())/7)+1); }
function isEvening(){ return new Date().getHours() >= 21; }

/* =====================================================
   SRSスケジューラ
===================================================== */
function st(id){
  if(!D.srs[id]) D.srs[id] = {ivl:0,due:null,ease:2.0,reps:0,lap:0,hist:[],stage:0};
  return D.srs[id];
}
function isNew(id){ return !D.srs[id] || D.srs[id].reps===0; }
function isDue(id){ const s = D.srs[id]; return s && s.reps>0 && s.due && s.due <= todayStr(); }

function grade(id, r, sec){
  const s = st(id);
  s.reps++;
  s.hist.push({d:todayStr(), sec:(sec!=null?Math.round(sec*10)/10:null), r});
  if(s.hist.length>20) s.hist.shift();
  if(r==="again"){ s.lap++; s.ivl = 0; s.due = todayStr(); }
  else if(r==="hard"){ s.ivl = Math.max(1, Math.round((s.ivl||1)*1.2)); s.ease = Math.max(1.3, s.ease-0.05); s.due = addDays(s.ivl); }
  else { // good
    s.ivl = s.ivl===0 ? 1 : Math.round(s.ivl * s.ease);
    s.ivl = Math.min(s.ivl, 120);
    s.ease = Math.min(2.6, s.ease+0.02);
    s.due = addDays(s.ivl);
  }
  D.totalReviews++;
  save();
}
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* 出題理由の生成 */
function whyText(id, isNewCard, item){
  if(isNewCard){
    return item._type==="sent" ? `今週のテーマ「${WEEK_THEME[Math.min(4,currentWeek())]||"応用"}」の新しい文` : "新しい表現(診断で優先と判定)";
  }
  const s = D.srs[id];
  const last = s.hist[s.hist.length-1];
  if(!last) return "復習";
  const ago = daysBetween(last.d, todayStr());
  const agoTxt = ago===0?"今日":ago===1?"昨日":`${ago}日前`;
  if(last.r==="again") return `${agoTxt}に出てこなかった問題`;
  if(last.r==="hard") return `${agoTxt}に「惜しい」だった問題`;
  if(last.sec!=null && last.sec>TARGET_SEC) return `${agoTxt}は ${last.sec.toFixed(1)}秒。目標は3秒`;
  return `${agoTxt}に正解。忘れる前の総仕上げ`;
}

/* =====================================================
   セッション構築
===================================================== */
function availableSents(){ const w = currentWeek(); return SENT.filter(x=>x.wk<=Math.max(1,w)); }

function buildQueue(minutes, mode){
  mode = mode || "mix";
  const evening = isEvening();
  const mixed = [];
  if(mode !== "listen"){
    const q = [];
    // 期限が来ている復習(文)
    const dueS = availableSents().filter(x=>isDue(x.id));
    // 期限が来ている復習(チャンク)
    const dueC = CHUNK.filter(x=>isDue(x.id));
    // 並べ替え: 遅延日数が大きい順
    const byOverdue = (a,b)=> (D.srs[a.id].due < D.srs[b.id].due ? -1 : 1);
    dueS.sort(byOverdue); dueC.sort(byOverdue);
    dueS.forEach(x=>q.push({t:"sent", item:x}));
    dueC.forEach(x=>q.push({t:"chunk", item:x}));
    // 新規(夜は出さない)
    if(!evening){
      const nS = minutes>=20?4: minutes>=10?3: (q.length===0?2:0);
      const nC = minutes>=20?4: minutes>=10?3: (q.length===0?2:0);
      // 文の新規: 診断で遅かったレベル順(4,3,2,1)ではなく、基礎から固めつつ週テーマ順
      const newS = availableSents().filter(x=>isNew(x.id)).slice(0, nS);
      // チャンク新規: pri優先
      const newC = CHUNK.filter(x=>isNew(x.id)).sort((a,b)=>b.pri-a.pri).slice(0, nC);
      newS.forEach(x=>q.push({t:"sent", item:x, isNew:true}));
      newC.forEach(x=>q.push({t:"chunk", item:x, isNew:true}));
    }
    // 文とチャンクを交互に混ぜる(インターリーブ)
    const sents = q.filter(x=>x.t==="sent"), chunks = q.filter(x=>x.t==="chunk");
    const maxLen = Math.max(sents.length, chunks.length);
    for(let i=0;i<maxLen;i++){ if(sents[i]) mixed.push(sents[i]); if(chunks[i]) mixed.push(chunks[i]); }
  }
  // リスニング: 「きく」は主役、ミックスは10分以上で挟む、「はなす」は無し
  const nL = mode==="listen" ? (minutes>=20?10: minutes>=10?7:4)
           : (mode==="mix" && minutes>=10 ? (minutes>=20?3:2) : 0);
  for(let i=0;i<nL;i++){
    const item = LISTEN[(D.profile.listenIdx + i) % LISTEN.length];
    const pos = Math.min(mixed.length, Math.round((i+1)*mixed.length/(nL+1)) + i);
    mixed.splice(pos, 0, {t:"listen", item});
  }
  // シャドーイング(20分)は最後(全コース共通)
  if(minutes>=20){
    mixed.push({t:"shadow", item:SHADOW[D.profile.shadowIdx % SHADOW.length]});
  }
  return mixed;
}

/* --- 音声 --- */
let voiceCache = null;
function pickVoice(){
  if(voiceCache) return voiceCache;
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en = vs.filter(v=>v.lang && v.lang.toLowerCase().startsWith("en"));
  voiceCache = en.find(v=>v.lang==="en-US") || en.find(v=>v.lang==="en-GB") || en[0] || null;
  return voiceCache;
}
let voiceJaCache = null;
function pickVoiceJa(){
  if(voiceJaCache) return voiceJaCache;
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voiceJaCache = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("ja")) || null;
  return voiceJaCache;
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged = ()=>{ voiceCache=null; voiceJaCache=null; pickVoice(); }; }
function speakAsync(text, rate, ja){
  return new Promise(res=>{
    if(!window.speechSynthesis) return res();
    const u = new SpeechSynthesisUtterance(text);
    const v = ja ? pickVoiceJa() : pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = ja ? "ja-JP" : "en-US";
    u.rate = rate || 1.0;
    // iOSではonend/onerrorが発火しないことがあり、待ちっぱなしになると
    // ドライブモードのループ全体が止まる。見張りタイマーで必ず先へ進める
    let done = false;
    const fin = ()=>{ if(done) return; done = true; clearTimeout(tm); res(); };
    const tm = setTimeout(fin, 3000 + text.length * 350);
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  });
}
function sleepMs(ms){ return new Promise(r=>setTimeout(r, ms)); }
function speak(text, rate){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
  u.rate = rate || 1.0;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function speedGraphSVG(logs){
  const pts = logs.slice(-30);
  const W=560, H=140, PAD=26;
  const maxY = Math.max(6, Math.ceil(Math.max(...pts.map(p=>p.medSec))));
  const x = i => PAD + (pts.length===1 ? (W-2*PAD)/2 : i*(W-2*PAD)/(pts.length-1));
  const y = v => H-18 - (v/maxY)*(H-34);
  let poly = pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.medSec).toFixed(1)}`).join(" ");
  const ty = y(TARGET_SEC);
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="反射速度の推移グラフ">
    <line x1="${PAD}" y1="${ty}" x2="${W-PAD}" y2="${ty}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="${W-PAD}" y="${ty-5}" text-anchor="end" font-size="10" fill="var(--ok)">目標 3.0秒</text>
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.medSec).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}
    <text x="${PAD}" y="${H-4}" font-size="10" fill="var(--sub)">← 過去</text>
    <text x="${W-PAD}" y="${H-4}" text-anchor="end" font-size="10" fill="var(--sub)">最新 →</text>
  </svg>`;
}

/* =====================================================
   セッション実行
===================================================== */
let SESSION = null;

function startSession(minutes, mode){
  mode = mode || "mix";
  if(mode === "drive"){ startDrive(minutes); return; }
  const queue = buildQueue(minutes, mode);
  if(!queue.length){
    alert("今日の復習も新規もありません。また明日どうぞ!");
    return;
  }
  SESSION = {min:minutes, t0:Date.now(), queue, done:0, secs:[], idx:0, over:false, mode};
  stepSession();
}
function sessionElapsedMin(){ return (Date.now()-SESSION.t0)/60000; }
function updateMeta(){
  const remain = Math.max(0, SESSION.min - sessionElapsedMin());
  metaEl.textContent = `残り ${Math.ceil(remain)}分 ・ ${SESSION.done}枚`;
}

function stepSession(){
  // 時間切れ判定(カードの切れ目でのみ終了)
  if(sessionElapsedMin() >= SESSION.min || SESSION.idx >= SESSION.queue.length){
    endSession(); return;
  }
  const cardDef = SESSION.queue[SESSION.idx];
  SESSION.idx++;
  clear(); updateMeta();
  drawProgress();
  if(cardDef.t==="sent") vSentCard(cardDef);
  else if(cardDef.t==="chunk") vChunkCard(cardDef);
  else if(cardDef.t==="listen") vListenCard(cardDef);
  else if(cardDef.t==="shadow") vShadowCard(cardDef);
}
function drawProgress(){
  const pct = Math.min(100, Math.round(sessionElapsedMin()/SESSION.min*100));
  app.appendChild(el(`<div class="progressbar"><i style="width:${pct}%"></i></div>`));
}

/* =====================================================
   ドライブモード(画面を見ない音声ドリル)
   自己採点が無いためSRSの記録には触れない(測定の純度を守る)
===================================================== */
let DRIVE = null;

function startDrive(minutes){
  if(!window.speechSynthesis){ alert("この端末では音声合成が使えないため、ドライブモードを開始できません。"); return; }
  // iOSは最初の読み上げがタップと同じ同期処理内にないと無音になる。
  // ここ(タップ直下)で空の発話を流して音声をアンロックしておく
  try{ speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(new SpeechSynthesisUtterance("")); }catch(e){}
  pickVoice(); pickVoiceJa();
  // 出題リスト: 期限切れ復習 → 学習済み → 未習の基礎、の順(文は最大30・チャンクは最大10)
  const seenS = availableSents().filter(x=>D.srs[x.id] && D.srs[x.id].reps>0);
  const dueS = seenS.filter(x=>isDue(x.id));
  const restS = seenS.filter(x=>!isDue(x.id));
  const padS = availableSents().filter(x=>isNew(x.id)).sort((a,b)=>a.lv-b.lv);
  const S = [...dueS, ...restS, ...padS].slice(0, 30);
  const C = CHUNK.filter(x=>D.srs[x.id] && D.srs[x.id].reps>0).slice(0, 10);
  const list = [];
  const n = Math.max(S.length, C.length);
  for(let i=0;i<n;i++){ if(S[i]) list.push({t:"sent", item:S[i]}); if(C[i]) list.push({t:"chunk", item:C[i]}); }
  if(!list.length){ alert("読み上げる教材がまだありません。まず通常のセッションを1回どうぞ。"); return; }
  DRIVE = {min:minutes, t0:Date.now(), i:0, played:0, paused:false, stopped:false, lock:null};
  vDrive(list);
}

async function vDrive(list){
  clear(); metaEl.textContent = "";
  // wakeLockをawaitすると最初の読み上げがタップ操作から切り離されて
  // iOSで無音になるため、待たずに取得だけ依頼して先へ進む
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{ if(DRIVE) DRIVE.lock = l; }).catch(()=>{}); }catch(e){}
  const c = card(`
    <span class="eyebrow">ドライブモード ・ ${DRIVE.min}分</span>
    <p class="sub">「日本語 →(声に出す間)→ 英語×2」が自動で流れ続けます。画面は見なくてOK。<b>操作は停車中に。</b>音が出ないときは本体横のサイレントスイッチ(消音)と音量を確認してください。</p>
    <button class="drive-main" data-act="toggle">⏸ 一時停止</button>
    <p class="sub" style="text-align:center;margin-top:10px" data-role="st">再生をはじめます…</p>
    <div class="choices"><button class="btn-ghost" data-act="quit">終了する</button></div>
  `);
  const stEl = c.querySelector('[data-role=st]');
  const tg = c.querySelector('[data-act=toggle]');
  tg.onclick = ()=>{
    DRIVE.paused = !DRIVE.paused;
    if(DRIVE.paused){ try{ speechSynthesis.cancel(); }catch(e){} tg.textContent = "▶ 再開"; }
    else tg.textContent = "⏸ 一時停止";
  };
  c.querySelector('[data-act=quit]').onclick = ()=> finishDrive(true);

  const bail = ()=> DRIVE.stopped || DRIVE.paused;
  const elapsedMin = ()=> (Date.now()-DRIVE.t0)/60000;
  while(!DRIVE.stopped && elapsedMin() < DRIVE.min){
    if(DRIVE.paused){ await sleepMs(400); continue; }
    const def = list[DRIVE.i % list.length];
    DRIVE.i++;
    stEl.textContent = `${DRIVE.i}枚目を再生中(タップ不要)`;
    const it = def.item;
    if(def.t === "sent"){
      await speakAsync(it.ja, 1.0, true);            if(bail()) continue;
      await sleepMs(2200 + it.lv*700);                if(bail()) continue;
      await speakAsync(it.en, 0.9);                   if(bail()) continue;
      await sleepMs(500);                             if(bail()) continue;
      await speakAsync(it.en, 1.0);
    } else {
      await speakAsync(it.ja, 1.0, true);            if(bail()) continue;
      await sleepMs(2400);                            if(bail()) continue;
      await speakAsync(it.en.replace(/〜/g,""), 0.95); if(bail()) continue;
      await sleepMs(400);                             if(bail()) continue;
      await speakAsync(it.ex, 0.9);
    }
    DRIVE.played++;
    await sleepMs(900);
  }
  if(!DRIVE.stopped) finishDrive(false);
}

function finishDrive(manual){
  if(!DRIVE || DRIVE.stopped) return;
  DRIVE.stopped = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if(DRIVE.lock) DRIVE.lock.release(); }catch(e){}
  const mins = Math.max(1, Math.round((Date.now()-DRIVE.t0)/60000));
  D.log.push({d:todayStr(), n:DRIVE.played, medSec:null, min:mins, mode:"drive"});
  if(D.log.length>200) D.log.shift();
  save();
  if(!manual) speakAsync("おつかれさまでした。今日のドライブレッスンはここまでです。", 1.0, true);
  clear(); metaEl.textContent = "";
  const c = card(`
    <span class="eyebrow">おつかれさま</span>
    <h1>ドライブレッスン終了</h1>
    <div class="statrow"><span class="k">流れたカード</span><span class="v">${DRIVE.played}枚</span></div>
    <div class="statrow"><span class="k">時間</span><span class="v">${mins}分</span></div>
    <p class="sub" style="margin-top:10px">自己採点が無いため反射速度グラフには入りません。耳と口の「追加の反復」として気楽に流してください。</p>
    <div class="choices"><button class="btn-primary">ホームへ戻る</button></div>
  `);
  c.querySelector("button").onclick = ()=>vHome();
}

/* =====================================================
   セッション終了・ご褒美
===================================================== */
function endSession(){
  clear(); metaEl.textContent="";
  const med = medianOf(SESSION.secs);
  D.log.push({d:todayStr(), n:SESSION.done, medSec:med!=null?Math.round(med*10)/10:null, min:SESSION.min, mode:SESSION.mode||"mix"});
  if(D.log.length>200) D.log.shift();
  save();

  let medHtml = "";
  if(med!=null){
    const prevLogs = D.log.filter(l=>l.medSec!=null);
    let deltaTxt = "";
    if(prevLogs.length>=2){
      const diff = Math.round((prevLogs[prevLogs.length-1].medSec - prevLogs[prevLogs.length-2].medSec)*10)/10;
      deltaTxt = diff<0 ? `<span class="delta down">前回より ${Math.abs(diff).toFixed(1)}秒 速くなっています</span>`
               : diff>0 ? `<span class="delta up">前回より ${diff.toFixed(1)}秒 ゆっくりでした(疲れている日はそういうものです)</span>` : "前回と同じ速さでした";
    }
    medHtml = `<div class="big-metric"><span class="num">${med.toFixed(1)}</span><span class="unit">秒</span></div>
      <p class="sub">今日の「言えるまで」中央値 ${deltaTxt}</p>`;
  }
  card(`
    <span class="eyebrow">おつかれさま</span>
    <h1>今日の分は、ここで終わりです</h1>
    ${medHtml}
    <div class="statrow"><span class="k">こなしたカード</span><span class="v">${SESSION.done}枚</span></div>
    <div class="statrow"><span class="k">かかった時間</span><span class="v">${Math.max(1,Math.round(sessionElapsedMin()))}分</span></div>
    <p class="sub" style="margin-top:10px">「もう少しできたのに」くらいでやめるのが、明日もやれるコツです。</p>
  `);

  /* バックアップ(1タップ)。アプリ更新時はここから復元する */
  const bk = card(`
    <h2>💾 バックアップ</h2>
    <p class="sub">今日の記録を含む全データのコードです。ときどきコピーしてメモアプリ等に貼っておくと、アプリが更新されて記録が見えなくなっても10秒で復元できます。</p>
    <div class="choices"><button class="btn-primary" data-act="copy">バックアップコードをコピー</button></div>
  `);
  bk.querySelector('[data-act=copy]').onclick = (e)=> copyText(exportCode(), e.target);

  // 変動報酬: 35%(初回は100%)
  const unownedS = STORY.filter(s=>!D.owned.includes(s.id));
  const unownedT = TIP.filter(t=>!D.owned.includes(t.id));
  const pool = [...unownedS, ...unownedT];
  const firstTime = D.log.length===1;
  if(pool.length && (firstTime || Math.random()<0.35)){
    const prize = pool[Math.floor(Math.random()*pool.length)];
    D.owned.push(prize.id); save();
    if(prize.text){ // story
      const c = card(`
        <span class="eyebrow">🎁 旅の戦利品</span>
        <h2>ミニストーリー「${esc(prize.title)}」を手に入れた</h2>
        <p class="sub">今のあなたのレベルで読める・聞ける旅の小話です。ホームの「旅の戦利品」からいつでも聞き直せます。</p>
        <div class="choices"><button class="btn-primary">読む・聞く</button></div>
      `,"reward");
      c.querySelector("button").onclick = ()=> vStory(prize, ()=>vHome());
    } else {
      card(`
        <span class="eyebrow">🎁 旅の戦利品</span>
        <h2>現地のリアルフレーズ</h2>
        <div class="prompt-en">${esc(prize.en)}</div>
        <p>${esc(prize.ja)}</p>
      `,"reward");
    }
  }

  const back = el(`<div class="choices"><button class="btn-ghost">ホームへ戻る</button></div>`);
  back.querySelector("button").onclick = ()=>vHome();
  app.appendChild(back);
}

function vStory(sty, onBack){
  clear();
  const c = card(`
    <span class="eyebrow">📖 ミニストーリー</span>
    <h1>${esc(sty.title)}</h1>
    <button class="play-btn small" style="width:auto">🔊 聞く(${D.profile.listenRate.toFixed(2)}x)</button>
    <p class="story-text">${esc(sty.text)}</p>
    <p class="sub">あらすじ: ${esc(sty.ja)}</p>
    <div class="choices"><button class="btn-ghost" data-act="back">戻る</button></div>
  `);
  c.querySelector(".play-btn").onclick = ()=> speak(sty.text, D.profile.listenRate);
  c.querySelector('[data-act=back]').onclick = onBack;
}

/* =====================================================
   起動
===================================================== */
(async ()=>{
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  // GitHub Pages配信時のみ有効になるオフライン対応(Artifact上では silently fail)
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{}); }catch(e){}
  // localStorageが空でもIndexedDBに残っていれば自動復旧
  if(!load()){
    const j = await idbGet();
    if(j){ try{ const d = JSON.parse(j); if(d && d.profile){ D = normalize(d); save(); } }catch(e){} }
  }
  if(!D.profile.onboarded && D.totalReviews===0) vWelcome();
  else if(!D.profile.onboarded) vOnboard();
  else vHome();
})();
</script>
